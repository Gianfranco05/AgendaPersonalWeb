services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vida_user
      POSTGRES_PASSWORD: vida_pass
      POSTGRES_DB: vida_personal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vida_user -d vida_personal"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vida_user:vida_pass@db:5432/vida_personal
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      JWT_COOKIE_NAME: vida_token
      DEBUG: "false"
      APP_NAME: Vida Personal
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
