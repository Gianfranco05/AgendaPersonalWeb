# Producción — HTTP en http://localhost (sin certificados, funciona out-of-the-box).
# Requiere un .env con SECRET_KEY fuerte (ver .env.prod.example).
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Para HTTPS con dominio real, sumar el override TLS:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.tls.yml up --build -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vida_personal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-vida_personal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vida_personal} -d ${POSTGRES_DB:-vida_personal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lifeos-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lifeos-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vida_personal}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-vida_personal}
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=false
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - REDIS_URL=redis://redis:6379/0
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@localhost}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Can_cen}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      - BILLING_PROVIDER=${BILLING_PROVIDER:-mercadopago}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - BILLING_CURRENCY=${BILLING_CURRENCY:-ARS}
      - MP_PRICE_MODULE_STUDY=${MP_PRICE_MODULE_STUDY:-}
      - MP_PRICE_MODULE_LIBRARY=${MP_PRICE_MODULE_LIBRARY:-}
      - MP_PRICE_MODULE_MEDIA=${MP_PRICE_MODULE_MEDIA:-}
      - MP_PRICE_MODULE_WORK=${MP_PRICE_MODULE_WORK:-}
      - MP_PRICE_MODULE_TRAVEL=${MP_PRICE_MODULE_TRAVEL:-}
      - MP_PRICE_MODULE_VEHICLE=${MP_PRICE_MODULE_VEHICLE:-}
      - MP_PRICE_MODULE_PROJECTS=${MP_PRICE_MODULE_PROJECTS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID_MODULE_STUDY=${STRIPE_PRICE_ID_MODULE_STUDY:-}
      - STRIPE_PRICE_ID_MODULE_LIBRARY=${STRIPE_PRICE_ID_MODULE_LIBRARY:-}
      - STRIPE_PRICE_ID_MODULE_MEDIA=${STRIPE_PRICE_ID_MODULE_MEDIA:-}
      - STRIPE_PRICE_ID_MODULE_WORK=${STRIPE_PRICE_ID_MODULE_WORK:-}
      - STRIPE_PRICE_ID_MODULE_TRAVEL=${STRIPE_PRICE_ID_MODULE_TRAVEL:-}
      - STRIPE_PRICE_ID_MODULE_VEHICLE=${STRIPE_PRICE_ID_MODULE_VEHICLE:-}
      - STRIPE_PRICE_ID_MODULE_PROJECTS=${STRIPE_PRICE_ID_MODULE_PROJECTS:-}
      - BILLING_SUCCESS_URL=${BILLING_SUCCESS_URL:-}
      - BILLING_CANCEL_URL=${BILLING_CANCEL_URL:-}
      # Sin estas cuatro, el login con Google y Calendar no andan en prod
      # aunque las claves esten en .env: esta lista es explicita y lo que no
      # figura aca no llega al contenedor.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-${PUBLIC_BASE_URL:-http://localhost}/ajustes/google/callback}
      - GOOGLE_LOGIN_REDIRECT_URI=${GOOGLE_LOGIN_REDIRECT_URI:-${PUBLIC_BASE_URL:-http://localhost}/auth/api/google/callback}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Opcionales: la lista es explicita, asi que sin estas lineas el valor del
      # .env no llega al contenedor (Sentry quedaba apagado, /metrics publico y
      # no se podia subir la version de los Terminos sin tocar el compose).
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - CURRENT_TERMS_VERSION=${CURRENT_TERMS_VERSION:-1.1}
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - lifeos-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - lifeos-net

networks:
  lifeos-net:
    driver: bridge

volumes:
  data:
  pgdata:
